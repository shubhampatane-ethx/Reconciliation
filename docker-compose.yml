services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=consistency
      - POSTGRES_PASSWORD=consistency
      - POSTGRES_DB=consistency
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consistency -d consistency"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # OLLAMA DISABLED
  # ============================================================
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   healthcheck:
  #     test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 30

  # ollama_pull:
  #   image: ollama/ollama:latest
  #   restart: "no"
  #   depends_on:
  #     ollama:
  #       condition: service_healthy
  #   environment:
  #     - OLLAMA_HOST=ollama:11434
  #   entrypoint: ["/bin/sh", "-c"]
  #   command:
  #     - "ollama pull llama3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://consistency:consistency@db:5432/consistency

      # Ollama disabled
      # - OLLAMA_BASE_URL=http://ollama:11434
      # - OLLAMA_MODEL=llama3

      # Groq is the PRIMARY AI provider
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=https://api.groq.com/openai/v1
      - GROQ_MODEL=llama-3.3-70b-versatile

      - JWT_SECRET=replace-this-with-a-secure-random-secret-in-production
      - JWT_ACCESS_TOKEN_EXPIRES_HOURS=24

      - DUMMY_SERVER_BASE_URL=http://dummy_server:9000

    depends_on:
      db:
        condition: service_healthy

      # Ollama dependencies removed
      # ollama:
      #   condition: service_healthy
      # ollama_pull:
      #   condition: service_completed_successfully

  target_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Swamiom@1702#
      - POSTGRES_DB=Target_Data
    ports:
      - "5433:5432"
    volumes:
      - target_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Target_Data"]
      interval: 5s
      timeout: 5s
      retries: 10

  target_db_seed:
    build:
      context: ./backend
      dockerfile: dummy_server/Dockerfile
    command: ["python", "-m", "dummy_server.seed_targets"]
    volumes:
      - ./backend:/app
    environment:
      - DUMMY_SERVER_DATABASE_URL=postgresql+psycopg2://postgres:Swamiom%401702%23@target_db:5432/Target_Data
    depends_on:
      target_db:
        condition: service_healthy
    restart: "no"

  dummy_server:
    build:
      context: ./backend
      dockerfile: dummy_server/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/app
    environment:
      - DUMMY_SERVER_DATABASE_URL=postgresql+psycopg2://postgres:Swamiom%401702%23@target_db:5432/Target_Data
    depends_on:
      target_db:
        condition: service_healthy
      target_db_seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  pgdata:
  target_pgdata:

  # Ollama volume disabled
  # ollama_models: