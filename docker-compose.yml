services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=consistency
      - POSTGRES_PASSWORD=consistency
      - POSTGRES_DB=consistency
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consistency -d consistency"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:29093,PLAINTEXT_HOST://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'ciWo7IWtSGqwACjNYWx6CA'
    volumes:
      - kafka_data:/var/lib/kafka/data

  recon_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "kafka_service.worker"]
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://consistency:consistency@db:5432/consistency
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_ENABLED=true
      - DUMMY_SERVER_BASE_URL=http://dummy_server:9000
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=gorakshakaduskar13@gmail.com
      - SMTP_PASSWORD=htrv vqia jukp fxyf
      - SMTP_FROM_EMAIL=gorakshakaduskar13@gmail.com
      - OLLAMA_BASE_URL=https://stretch-lou-last-incentive.trycloudflare.com
      - OLLAMA_MODEL=llama3.2:3b
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=https://api.groq.com/openai/v1
      - GROQ_MODEL=llama-3.3-70b-versatile
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://consistency:consistency@db:5432/consistency
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_ENABLED=true
      # Points at your external Ollama server, exposed via a Cloudflare
      # Tunnel (trycloudflare.com). Reachable from inside Docker since
      # it's a public HTTPS URL rather than a Docker service name.
      # Note: trycloudflare.com quick tunnel URLs are ephemeral — they
      # change every time the tunnel is restarted, so update this value
      # whenever that happens.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://100.93.93.84:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      # Groq is the PRIMARY AI provider for the chat assistant; Ollama
      # (above) is the automatic fallback when Groq can't answer. Set
      # GROQ_API_KEY in the root .env file — get a free key at
      # https://console.groq.com → API Keys.
      - GROQ_API_KEY=${GROQ_API_KEY:-your_groq_api_key_here}
      - GROQ_BASE_URL=https://api.groq.com/openai/v1
      - GROQ_MODEL=llama-3.3-70b-versatile
      # Change this to a long random string in production.
      # Generate one with: python -c "import secrets; print(secrets.token_hex(32))"
      - JWT_SECRET=replace-this-with-a-secure-random-secret-in-production
      - JWT_ACCESS_TOKEN_EXPIRES_HOURS=24
      # Inside Docker, the dummy_server container is reachable by service name.
      - DUMMY_SERVER_BASE_URL=http://dummy_server:9000
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started

  # Dockerized Target_Data database — replaces the old setup where
  # dummy_server reached out to Postgres running on the host machine (via
  # pgAdmin). Now everything, including the target data, lives inside
  # Docker. Mapped to host port 5433 (not 5432, since `db` already uses
  # that) purely so you can still open it in pgAdmin/DBeaver from your
  # host machine if you want to look at it directly.
  target_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Swamiom@1702#
      - POSTGRES_DB=Target_Data
    ports:
      - "5433:5432"
    volumes:
      - target_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Target_Data"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job: loads every workbook registered in
  # backend/dummy_server/target_registry.py into target_db — one table
  # per project (cjbs_target_table, etairos_target_table,
  # airetech_target_table, ats_target_table). Runs once per
  # `docker compose up` and then exits (restart: "no") — it's not a
  # long-running service. Safe to re-run any time
  # (docker compose run --rm target_db_seed): it always drops and
  # recreates every table from its workbook.
  target_db_seed:
    build:
      context: ./backend
      dockerfile: dummy_server/Dockerfile
    command: ["python", "-m", "dummy_server.seed_targets"]
    volumes:
      - ./backend:/app
    environment:
      - DUMMY_SERVER_DATABASE_URL=postgresql+psycopg2://postgres:Swamiom%401702%23@target_db:5432/Target_Data
    depends_on:
      target_db:
        condition: service_healthy
    restart: "no"

  dummy_server:
    build:
      context: ./backend
      dockerfile: dummy_server/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/app
    environment:
      # Target_Data now runs as the target_db service below, inside the
      # same Docker network — no more host.docker.internal / local pgAdmin.
      # Password special chars (@, #) are percent-encoded for the URL.
      - DUMMY_SERVER_DATABASE_URL=postgresql+psycopg2://postgres:Swamiom%401702%23@target_db:5432/Target_Data
    depends_on:
      target_db:
        condition: service_healthy
      target_db_seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
      # Vite's dev server runs INSIDE this container, so "localhost" from its
      # point of view is the frontend container itself, not the backend one.
      # Docker Compose gives each service a DNS name matching its service
      # name ("backend"), reachable on the internal network at port 5000.
      - VITE_BACKEND_PROXY_TARGET=http://backend:5000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  pgdata:
  target_pgdata:
  kafka_data: